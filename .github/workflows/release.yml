name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag && inputs.tag || github.ref_name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            ext: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            ext: ""
          - goos: windows
            goarch: amd64
            archive: zip
            ext: ".exe"
          - goos: windows
            goarch: arm64
            archive: zip
            ext: ".exe"
    steps:
      - name: Validate manual input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag input is required (e.g. v0.1.0)" >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "-s -w -X main.version=${TAG}" -o "dist/bushitsu${{ matrix.ext }}" .

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ASSET="bushitsu_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          cd dist
          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf "$ASSET" "bushitsu${{ matrix.ext }}"
          else
            zip -9 "$ASSET" "bushitsu${{ matrix.ext }}"
          fi
          rm -f "bushitsu${{ matrix.ext }}"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ inputs.tag && inputs.tag || github.ref_name }}
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in bushitsu_*; do
            if [[ -f "$f" ]]; then
              shasum -a 256 "$f"
            fi
          done > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
